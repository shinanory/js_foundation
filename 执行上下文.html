<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Js App</title>
	</head>
  	<body>
		<div class="a" id="b1"></div>
		<script>
			/*
				js在全局开始、函数开始执行时都会创建一个执行上下文，并放入执行上下文栈的栈顶
					- 全局上下文：分为全局window（var、function在这里）和全局scope（let、const、class在这里）
					- 函数上下文
					- 全局上下文永久存在、函数上下文在函数执行完毕后弹出栈顶
					- 函数执行时会按照作用域链由外到内寻找变量
				js在执行一段代码前会有如下过程：
					- 创建执行上下文
					- 分析：顶级var变量提升、顶级函数声明提升、let/const/class变量提升、块中的函数声明
					- 处理重名
					- 绑定：var->undefined、function->初始化函数对象、块中的函数->undefined、let/const/class未初始化
					- 执行代码
			*/
			const fn = ()=>{
				console.log(a) // undefined
				var a = 2 // 变量声明会提升，变量赋值(包括赋值为函数)不提升
				console.log(a) // 2
			}
			// console.log(a) // a is not defined
			fn()

			const fn2 = ()=>{
				// 函数定义会提升
				function a(){
					console.log('a1')
				}
				a() // a2
				function a(){
					console.log('a2')
				}
				a() //a2
				/*
					等同于：
					var a
					a = function(){
						console.log('a1')
					}
					a = function(){
						console.log('a2')
					}
					a()
					a()
				*/
			}
			fn2()

			const fn3=()=>{
				console.log(this)
			}
			fn3()
		</script>
  	</body>
</html>

<style>
.a {
	width: 200px;
	height: 200px;
	margin-left: 50px;
	background-color: antiquewhite;
}
</style>
