<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="root"></div>
</body>
<script>
    // 创建普通DOM节点
    function myCreateElement(type, props, ...children){
        return {
            type,
            props: {
                ...props,
                children: children.map(child=>{
                    return typeof child === 'object' ? child : myCreateTextElement(child)
                })
            }
        }
    }
    // 创建文本DOM节点
    function myCreateTextElement(text){
        return {
            type: 'TEXT_ELEMENT',
            props: {
                nodeValue: text,
                children: []
            }
        }
    }

    // 根据fiber创建不同DOM节点
    function createDom(fiber){
        const dom = fiber.type == "TEXT_ELEMENT"? document.createTextNode("") : document.createElement(fiber.type)
        // 设置当前节点属性
        const isProperty = (key)=>{
            return key !== 'children'
        } // 函数：判断是否为属性
        Object.keys(fiber.props).filter(isProperty).forEach((name) => {
            dom[name] = fiber.props[name]
        }) // 过滤为属性的props, 并设置为当前节点的属性
        return dom
    }

    // 设置根节点，开启渲染任务
    function render(element, container){
        // 创建根fiber
        const root = {
            dom: container,
            props: {
                children: [element]
            }
        }
        // 开启任务
        nextUnitOfWork = root
    }

    let nextUnitOfWork = null  // 下一个工作单元

    function workloop(deadline){
        let shouldYield = false
        while(nextUnitOfWork && !shouldYield){
            // 执行当前工作单元并更新
            nextUnitOfWork = performUnitOfWork(nextUnitOfWork)
            shouldYield = deadline.timeRemaining() < 1
        }
        requestIdleCallback(workloop)
    }
    requestIdleCallback(workloop)

    // 一次工作单元
    function performUnitOfWork(fiber) {
        // 一、根据当前fiber，创建DOM节点并渲染（并存放在fiber中的dom属性）
        if(!fiber.dom){
            fiber.dom = createDom(fiber)
        }
        if(fiber.parent){
            // 浏览器可能会随时中断一次渲染流程，若每次创建dom后就立即渲染该节点，可能会造成页面显示不完整
            fiber.parent.dom.appendChild(fiber.dom)
        }
        // 二、为当前fiber的子节点创建fiber
        const elements = fiber.props.children
        let index = 0
        let prevSibling = null
        while(index < elements.length){
            const element = elements[index]
            // 创建新Fiber
            const newFiber = {
                type: element.type, // 节点类型
                props: element.props, // 节点属性
                parent: fiber, // 父节点
                dom: null // 节点DOM
            }
            // 设置关系
            if(index === 0){
                fiber.child = newFiber // 设置父节点的第一个子节点
            }
            else{
                prevSibling.sibling = newFiber // 设置为上一个节点的同级节点
            }
            // 计数更新
            prevSibling = newFiber
            index++
        }
        // 三、根据关系寻找下一个工作单元
        if(fiber.child){
            return fiber.child // 先找子节点
        }
        let nextFiber = fiber
        while(nextFiber){
            if (nextFiber.sibling) {
                return nextFiber.sibling // 再找兄弟节点
            }
            nextFiber = nextFiber.parent // 没有兄弟节点则指向父节点。找到根节点时parent是undefined，跳出while循环
        }
    }

    // 模拟JSX => JS
    const element = myCreateElement(
        'h4', 
        {title: 'foo'}, 
        myCreateElement('span', {}, "hello"),
    )
    // JS => 渲染
    const container = document.getElementById('root')
    render(element, container)

</script>
</html>
