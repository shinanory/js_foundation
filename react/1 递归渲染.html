    // 创建普通DOM节点
    function myCreateElement(type, props, ...children){
        return {
            type,
            props: {
                ...props,
                children: children.map(child=>{
                    return typeof child === 'object' ? child : myCreateTextElement(child)
                })
            }
        }
    }
    // 创建文本DOM节点
    function myCreateTextElement(text){
        return {
            type: 'TEXT_ELEMENT',
            props: {
                nodeValue: text,
                children: []
            }
        }
    }
    // 根据js对象创建并渲染DOM节点
    function render(element, container){
        // 判断创建方式
        const dom = element.type == "TEXT_ELEMENT"? document.createTextNode(""): document.createElement(element.type)
        // 设置当前节点属性
        const isProperty = (key)=>{
            return key !== 'children'
        } // 判断是否为属性
        Object.keys(element.props).filter(isProperty).forEach((name) => {
            dom[name] = element.props[name]
        }) // 过滤为属性的props, 并设置为当前节点的属性
        // 递归调用
        element.props.children.forEach(child => 
            render(child, dom)
        )
        container.appendChild(dom)
    }

    // 模拟JSX => JS
    const element = myCreateElement('h1', {title: 'foo'}, 'Hello')
    // JS => 渲染
    const container = document.getElementById('root')
    render(element, container)

    // const a = document.createElement('h1')

</script>
