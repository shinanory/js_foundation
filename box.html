<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Box App</title>
	</head>
  	<body>
		<!-- <div class="a" id="b1"></div>
		
		<div class="a" id="b2"></div>
		
		<div class="a" id="b3"></div> -->
		<!-- <div>
			<span style="font-size: 15px;">我是15px</span>
			<br>
			<span style="">我是默认</span>
		</div> -->
		<!--
			BFC是一类区域，该区域内元素不受外部元素的影响
			overflow可以创建BFC
			作用:
			1. 计算检测内部float元素的高度（普通div在内部元素float脱离文档流后不会被撑开，但是如果这个div是BFC区域则会被撑开）
			2. 解决margin塌陷
			3. 左右分栏布局（BFC区域不会和float产生交集，会躲开外部的float的元素）（固定大盒子宽度，子盒子可以自适应）
		-->
		<div style="background-color: aquamarine; overflow: auto;">
			<div class="a" style="float: left;"></div>
			<div class="a" style="float: left;"></div>
			<div class="a" style="float: left;"></div>
		</div>
		<div style="background-color: blanchedalmond; float: left; width: 300px;">
			<div class="a" style="float: left;"></div>
			<div style="height: 150px; border: 1px solid black; background-color: rgb(255, 225, 127); overflow: hidden;">
				测试测试测试测试测试测试测试测试测试测试测试测试测试测试测试测试测试测试测试
			</div>
		</div>
  	</body>
</html>

<style>
.a {
	width: 50px;
	height: 50px;
	margin: 5px;
	border: 1px solid black;
	background-color: antiquewhite;
}
#b1 {
	box-sizing: content-box; /* 标准盒模型：w，h只算content */
}
#b2 {
	box-sizing: border-box; /* IE盒模型：w，h算content+padding+border */
}
</style>
